info:
  name: Create new post
  type: http
  seq: 3

http:
  method: POST
  url: "{{host}}/api/v1/posts"
  body:
    type: json
    data: "{\r

      \    \"title\": \"New post!\",\r

      \    \"content\": \"Here's my new post!\"\r

      }"
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: post_id
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
